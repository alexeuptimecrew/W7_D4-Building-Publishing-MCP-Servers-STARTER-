[project]
name = "agent-svc"
version = "0.1.0"
description = "The W7 capstone: a three-agent LangGraph service (retrieval + api + synthesis) for acme.example.internal."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
    "langgraph>=0.2",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

# Bare `pytest` (as CodeSandbox / most runners invoke it) does not add the project
# root to sys.path. pythonpath fixes `import agent_svc`, and asyncio_mode="auto"
# lets `async def test_*` run without a per-test decorator.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
